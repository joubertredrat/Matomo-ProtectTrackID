name: Tests

on:
  push:
    paths-ignore:
      - '*.md'
      - '*.json'
      - '*.png'
      - 'license'
      - '.editorconfig'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        php:
          - matomo6_min_php
          - matomo6_max_php
        matomo-target:
          - minimum_required_matomo
          - maximum_supported_matomo
        node:
          - '24'
        database:
          - engine: Mysql
            version: '8.0'
          - engine: Mariadb
            version: '10.6'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    name: >-
      Tests w/ PHP ${{ matrix.php }}, Node.js ${{ matrix.node }}, Target Matomo
      '${{ matrix.matomo-target }}', ${{ matrix.database.engine }}
      ${{ matrix.database.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - name: Run plugin tests
        uses: matomo-org/github-action-tests@main
        with:
          plugin-name: ProtectTrackID
          test-type: PluginTests
          php-version: '${{ matrix.php }}'
          matomo-test-branch: '${{ matrix.matomo-target }}'
          node-version: '${{ matrix.node }}'
          mysql-service: true
          mysql-engine: '${{ matrix.database.engine }}'
          mysql-version: '${{ matrix.database.version }}'
          phpunit-test-options: --testdox
